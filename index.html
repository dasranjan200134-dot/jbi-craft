    <script>
      // Clear any old placeholder photo caches and remove old demo admin/user credentials
      try {
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('jbi_about') || k.includes('about_photo') || k === 'jbi_products_catalog') {
            localStorage.removeItem(k);
          }
        });

        // Remove all legacy localStorage-based user storage and auth keys
        ['jbi_user_auth', 'jbi_admin_auth', 'jbi_registered_users', 'jbi_admin_customers', 'jbi_admin_password'].forEach(key => {
          try { localStorage.removeItem(key); } catch(e) {}
        });
      } catch(e) {}

      // Initialize Supabase Backend Sync
      window.addEventListener('DOMContentLoaded', () => {
        if (window.SupabaseService && typeof window.SupabaseService.syncDatabase === 'function') {
          window.SupabaseService.syncDatabase().catch(err => console.warn('[Supabase Sync]', err));
        }
      });

      // Background periodic sync and sync on tab focus
      window.addEventListener('focus', () => {
        if (window.SupabaseService && typeof window.SupabaseService.syncDatabase === 'function') {
          window.SupabaseService.syncDatabase().catch(err => console.warn('[Supabase Sync on Focus]', err));
        }
      });
      setInterval(() => {
        if (window.SupabaseService && typeof window.SupabaseService.syncDatabase === 'function') {
          window.SupabaseService.syncDatabase().catch(err => console.warn('[Supabase Periodic Sync]', err));
        }
      }, 60000);

      // Universal Product Image Fallback & Error Resilience Handler
      window.addEventListener('error', (event) => {
        const target = event.target;
        if (target && target.tagName === 'IMG') {
          if (!target.dataset.hasFallback) {
            target.dataset.hasFallback = 'true';
            // If the image fails to load, try default craft placeholder
            const currentSrc = target.getAttribute('src') || '';
            if (currentSrc && !currentSrc.includes('placeholder')) {
              target.src = '/assets/dhokra_mana_bowl_1787816018205-CnDZJKAI.jpg';
            }
          }
        }
      }, true);
    </script>

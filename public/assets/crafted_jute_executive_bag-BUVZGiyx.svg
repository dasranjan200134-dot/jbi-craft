<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Realistic Shadow -->
    <filter id="bag-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="-8" dy="16" stdDeviation="18" flood-color="#2a2015" flood-opacity="0.25"/>
    </filter>
    <filter id="strap-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Jute Texture Pattern -->
    <pattern id="jute-tex" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E8DEC8"/>
      <path d="M0 2h8M0 6h8M2 0v8M6 0v8" stroke="#D3C5A8" stroke-width="0.75"/>
      <path d="M0 0l8 8M8 0l-8 8" stroke="#F4EDE0" stroke-width="0.35" opacity="0.6"/>
    </pattern>

    <!-- Jute Side Shadow Texture -->
    <pattern id="jute-side-tex" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#CBBDA2"/>
      <path d="M0 2h8M0 6h8M2 0v8M6 0v8" stroke="#B8A789" stroke-width="0.75"/>
    </pattern>

    <!-- Maroon Band -->
    <linearGradient id="exec-maroon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6F1523"/>
      <stop offset="50%" stop-color="#8E1C30"/>
      <stop offset="100%" stop-color="#6F1523"/>
    </linearGradient>

    <!-- Konark Wheel Motif for Band -->
    <g id="exec-wheel">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#F5ECD8" stroke-width="1.8"/>
      <circle cx="20" cy="20" r="13" fill="none" stroke="#F5ECD8" stroke-width="0.8"/>
      <!-- Spokes -->
      <line x1="20" y1="6" x2="20" y2="34" stroke="#F5ECD8" stroke-width="1.5"/>
      <line x1="6" y1="20" x2="34" y2="20" stroke="#F5ECD8" stroke-width="1.5"/>
      <line x1="10" y1="10" x2="30" y2="30" stroke="#F5ECD8" stroke-width="1.5"/>
      <line x1="10" y1="30" x2="30" y2="10" stroke="#F5ECD8" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="4.5" fill="#8E1C30" stroke="#F5ECD8" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="2" fill="#F5ECD8"/>
    </g>

    <!-- Side Gusset Shading -->
    <linearGradient id="side-depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A241D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Clean Background -->
  <rect width="800" height="600" fill="#FAFAFA"/>

  <!-- Floor Contact Shadow -->
  <ellipse cx="430" cy="540" rx="260" ry="20" fill="#201A14" opacity="0.15" filter="blur(10px)"/>

  <!-- ==================== EXECUTIVE BAG IN 3/4 VIEW ==================== -->
  <g filter="url(#bag-shadow)">
    
    <!-- TOP HANDLE LOOP -->
    <path d="M 380 90 C 380 72, 490 72, 515 90 L 510 102 C 490 86, 395 86, 385 102 Z" fill="#D3C3A4" stroke="#2B231C" stroke-width="2"/>
    <path d="M 390 92 C 410 82, 480 82, 505 92" stroke="#FAF4E8" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- ==================== SIDE EXPANDABLE GUSSET (Right Depth Panel) ==================== -->
    <g>
      <!-- Side Accordion Base Panel -->
      <polygon points="505,108 585,145 640,490 535,480 505,108" fill="url(#jute-side-tex)" stroke="#2B231C" stroke-width="3"/>
      <!-- Inner Accordion Fold Shadow -->
      <polygon points="540,125 585,145 640,490 595,485 540,125" fill="#1C1814" opacity="0.18"/>
      <!-- Accordion Stitching & Creases -->
      <line x1="565" y1="135" x2="615" y2="487" stroke="#2B231C" stroke-width="2.5"/>
      <line x1="540" y1="125" x2="575" y2="483" stroke="#8E7E63" stroke-width="1.5" stroke-dasharray="4 3"/>

      <!-- Metal D-Ring for Strap -->
      <rect x="575" y="270" width="14" height="28" rx="4" fill="#D1BA8D" stroke="#333" stroke-width="2"/>
      <path d="M 578 274 L 578 294" stroke="#FFF" stroke-width="1.5"/>
    </g>

    <!-- ==================== MAIN FRONT FLAP & BODY ==================== -->
    <!-- Front Flap Outline & Texture (curving from top left to bottom) -->
    <path d="M 315 98 C 340 76, 470 76, 505 108 L 475 488 C 470 500, 455 506, 440 502 L 270 422 C 255 415, 248 400, 252 385 L 315 98 Z" fill="url(#jute-tex)" stroke="#2B231C" stroke-width="4"/>

    <!-- Subtle Curved Shading on Flap -->
    <path d="M 315 98 C 340 76, 470 76, 505 108 L 475 488 C 470 500, 455 506, 440 502 L 270 422 C 255 415, 248 400, 252 385 L 315 98 Z" fill="url(#side-depth)"/>

    <!-- Flap Perimeter Stitching Line -->
    <path d="M 320 106 C 343 86, 462 86, 496 114 L 468 478 C 464 488, 452 492, 440 488 L 278 412 C 265 406, 260 394, 263 382 L 320 106 Z" fill="none" stroke="#9A896D" stroke-width="1.5" stroke-dasharray="5 3"/>

    <!-- ==================== CENTER DIAMOND EMBLEM ==================== -->
    <g transform="translate(390, 215) rotate(14)">
      <!-- Outer Black Diamond Frame -->
      <polygon points="0,-42 32,0 0,42 -32,0" fill="#1C1814" stroke="#111" stroke-width="2"/>
      <!-- Inner Jute Field -->
      <polygon points="0,-36 27,0 0,36 -27,0" fill="url(#jute-tex)"/>
      <!-- Center Maroon Embroidered Patch -->
      <polygon points="0,-26 18,0 0,26 -18,0" fill="#881B2D" stroke="#F6ECD8" stroke-width="1.2"/>
      <!-- Traditional Inner Filigree/Ikat Cross -->
      <circle cx="0" cy="0" r="4" fill="#F6ECD8"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#F6ECD8" stroke-width="1"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#F6ECD8" stroke-width="1"/>
    </g>

    <!-- ==================== BOTTOM MAROON SAMBALPURI BAND ==================== -->
    <g transform="translate(268, 386) rotate(18.5)">
      <!-- Maroon Strip Base -->
      <rect x="0" y="0" width="220" height="42" fill="url(#exec-maroon)" stroke="#2B231C" stroke-width="1.5"/>
      <line x1="0" y1="2" x2="220" y2="2" stroke="#DFBD7D" stroke-width="1"/>
      <line x1="0" y1="40" x2="220" y2="40" stroke="#DFBD7D" stroke-width="1"/>

      <!-- Repeating Konark Wheels -->
      <use href="#exec-wheel" x="6" y="1"/>
      <use href="#exec-wheel" x="50" y="1"/>
      <use href="#exec-wheel" x="94" y="1"/>
      <use href="#exec-wheel" x="138" y="1"/>
      <use href="#exec-wheel" x="182" y="1"/>
    </g>

    <!-- ==================== SHOULDER STRAP ==================== -->
    <g filter="url(#strap-shadow)">
      <!-- Strap extending from side ring down and around -->
      <path d="M 582 285 C 570 330, 580 430, 510 495 C 440 560, 240 540, 155 490 C 145 484, 152 468, 168 474 C 235 500, 420 520, 480 470 C 535 425, 530 340, 545 285 Z" fill="url(#jute-tex)" stroke="#2B231C" stroke-width="2.5"/>
      <!-- Strap Stitches -->
      <path d="M 576 295 C 565 335, 575 425, 508 488 C 440 550, 245 532, 162 482" fill="none" stroke="#9A896D" stroke-width="1.2" stroke-dasharray="4 3"/>
      <!-- Strap Buckle / Adjuster -->
      <rect x="475" y="475" width="22" height="32" rx="4" transform="rotate(25 475 475)" fill="#D1BA8D" stroke="#333" stroke-width="2"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Multi-layered Contact & Ambient Shadows for Studio Lighting -->
    <filter id="pedi-ambient-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.15   0 0 0 0 0.18   0 0 0 0 0.22  0 0 0 0.18 0"/>
    </filter>
    <filter id="pedi-contact-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.12   0 0 0 0 0.14   0 0 0 0 0.18  0 0 0 0.4 0"/>
    </filter>

    <!-- Natural Sandstone Disc Top Face Radial Gradient -->
    <radialGradient id="sandstone-top" cx="48%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#FCFCFD"/>
      <stop offset="35%" stop-color="#E8EAEF"/>
      <stop offset="70%" stop-color="#D3D7E0"/>
      <stop offset="90%" stop-color="#B8BECC"/>
      <stop offset="100%" stop-color="#A4ABB9"/>
    </radialGradient>

    <!-- Sandstone Disc Beveled Rim Gradient -->
    <linearGradient id="sandstone-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E5EC"/>
      <stop offset="30%" stop-color="#C2C8D4"/>
      <stop offset="70%" stop-color="#9CA3B2"/>
      <stop offset="100%" stop-color="#798192"/>
    </linearGradient>

    <!-- Base Support Feet Gradient -->
    <linearGradient id="pedi-feet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9AA2B2"/>
      <stop offset="60%" stop-color="#6E7687"/>
      <stop offset="100%" stop-color="#464C59"/>
    </linearGradient>

    <!-- Natural Porous Stone Grain & Concentric Rubbing Rings Pattern -->
    <pattern id="stone-texture" width="36" height="28" patternUnits="userSpaceOnUse">
      <!-- Fine stippled mineral dots -->
      <circle cx="5" cy="4" r="1.1" fill="#878E9D" opacity="0.35"/>
      <circle cx="16" cy="18" r="0.9" fill="#757D8E" opacity="0.3"/>
      <circle cx="28" cy="8" r="1.3" fill="#9BA2B0" opacity="0.4"/>
      <circle cx="22" cy="24" r="0.8" fill="#6A7282" opacity="0.35"/>
      <circle cx="10" cy="14" r="1.4" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="32" cy="20" r="1.0" fill="#FFFFFF" opacity="0.5"/>
      
      <!-- Subtle wavy sandalwood grinding grain curves -->
      <path d="M 0 10 Q 18 16 36 10" fill="none" stroke="#ADB5C4" stroke-width="0.8" opacity="0.4"/>
      <path d="M 0 20 Q 18 25 36 20" fill="none" stroke="#8E97A8" stroke-width="0.7" opacity="0.3"/>
    </pattern>

    <!-- Concentric Sandalwood Grinding Tool Marks -->
    <radialGradient id="grinding-wear" cx="48%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#E8EAEF" stop-opacity="0.1"/>
      <stop offset="65%" stop-color="#A5ACB9" stop-opacity="0.25"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#838B9C" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Clean Pure White Studio Background -->
  <rect width="900" height="650" fill="#FFFFFF"/>

  <!-- ==================== STUDIO FLOOR SHADOW ==================== -->
  <g opacity="0.85">
    <ellipse cx="450" cy="455" rx="280" ry="60" fill="#1C2028" filter="url(#pedi-ambient-shadow)"/>
    <ellipse cx="450" cy="460" rx="230" ry="32" fill="#151820" filter="url(#pedi-contact-shadow)"/>
  </g>

  <!-- ==================== INTEGRATED TRIPOD BASE FEET ==================== -->
  <g>
    <!-- Left Tripod Foot Base -->
    <path d="M 270 415 L 265 448 C 265 454, 285 456, 298 450 L 305 422 Z" fill="url(#pedi-feet-grad)"/>
    <path d="M 265 448 C 265 454, 285 456, 298 450" fill="none" stroke="#2B303C" stroke-width="1.5"/>

    <!-- Center/Right Tripod Foot Base -->
    <path d="M 605 422 L 612 450 C 625 456, 645 454, 645 448 L 640 415 Z" fill="url(#pedi-feet-grad)"/>
    <path d="M 612 450 C 625 456, 645 454, 645 448" fill="none" stroke="#2B303C" stroke-width="1.5"/>

    <!-- Subtle Rear Tripod Shadow Accent -->
    <ellipse cx="450" cy="445" rx="25" ry="6" fill="#3D4452" opacity="0.4"/>
  </g>

  <!-- ==================== MAIN SANDSTONE CYLINDER BODY ==================== -->
  <g>
    <!-- 1. Vertical Cylindrical Chamfered Edge Wall -->
    <path d="M 185 345 C 185 445, 715 445, 715 345 L 715 375 C 715 475, 185 475, 185 375 Z" fill="url(#sandstone-rim)"/>
    
    <!-- Stone Texture on Edge Wall -->
    <path d="M 185 345 C 185 445, 715 445, 715 345 L 715 375 C 715 475, 185 475, 185 375 Z" fill="url(#stone-texture)"/>

    <!-- Bottom Contact Shadow line on Stone Rim -->
    <path d="M 185 375 C 185 475, 715 475, 715 375" fill="none" stroke="#484F5E" stroke-width="2.5" opacity="0.7"/>

    <!-- 2. Flat Oval Top Grinding Surface Face -->
    <ellipse cx="450" cy="345" rx="265" ry="120" fill="url(#sandstone-top)"/>

    <!-- Natural Sandstone Swirl & Texture Layer -->
    <ellipse cx="450" cy="345" rx="265" ry="120" fill="url(#stone-texture)"/>

    <!-- Concentric Grinding Wear & Luster Rings -->
    <ellipse cx="450" cy="345" rx="265" ry="120" fill="url(#grinding-wear)"/>

    <!-- Smooth Hand-Worn Sandalwood Grinding Center Zone -->
    <ellipse cx="445" cy="340" rx="190" ry="85" fill="#FFFFFF" opacity="0.3" filter="url(#pedi-ambient-shadow)"/>

    <!-- 3. Crisp Rounded Top Bevel Edge -->
    <ellipse cx="450" cy="345" rx="265" ry="120" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>
    <ellipse cx="450" cy="346" rx="266" ry="120.5" fill="none" stroke="#878E9D" stroke-width="1.2" opacity="0.6"/>

    <!-- Subtle Natural Stratification Vein Lines Across Surface -->
    <path d="M 230 365 C 320 330, 520 380, 670 335" fill="none" stroke="#99A1AF" stroke-width="1.2" opacity="0.35"/>
    <path d="M 260 330 C 370 295, 540 345, 650 310" fill="none" stroke="#99A1AF" stroke-width="1.0" opacity="0.3"/>
    <path d="M 210 350 C 340 385, 570 325, 685 360" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.45"/>
  </g>
</svg>

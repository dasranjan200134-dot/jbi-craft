<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3c2f1f" flood-opacity="0.18"/>
    </filter>
    <filter id="handle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Jute Texture Pattern -->
    <pattern id="jute-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#dfd0b5"/>
      <path d="M0 2h8M0 6h8M2 0v8M6 0v8" stroke="#cebca0" stroke-width="0.75"/>
      <path d="M0 0l8 8M8 0l-8 8" stroke="#ebdcc4" stroke-width="0.35" opacity="0.6"/>
    </pattern>

    <!-- Orange Ikat Pattern -->
    <pattern id="ikat-band-pattern" width="24" height="20" patternUnits="userSpaceOnUse">
      <rect width="24" height="20" fill="#E8681A"/>
      <!-- Black tribal diamond grid -->
      <path d="M12 2 L22 10 L12 18 L2 10 Z" fill="#1C1B18" stroke="#FFA756" stroke-width="0.5"/>
      <circle cx="12" cy="10" r="2.5" fill="#FAF4E6"/>
      <circle cx="0" cy="10" r="1.5" fill="#FAF4E6"/>
      <circle cx="24" cy="10" r="1.5" fill="#FAF4E6"/>
      <circle cx="12" cy="0" r="1" fill="#FFA756"/>
      <circle cx="12" cy="20" r="1" fill="#FFA756"/>
    </pattern>

    <!-- Leather Gradient -->
    <linearGradient id="leather-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#AF531C"/>
      <stop offset="50%" stop-color="#883B10"/>
      <stop offset="100%" stop-color="#672906"/>
    </linearGradient>

    <!-- Jute Lighting Gradient -->
    <linearGradient id="jute-shading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Piping Trim Gradient -->
    <linearGradient id="piping-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFBD7D"/>
      <stop offset="100%" stop-color="#B79455"/>
    </linearGradient>
  </defs>

  <!-- Clean Background -->
  <rect width="800" height="600" fill="#FBFBFB"/>
  
  <!-- Subtle ground shadow -->
  <ellipse cx="400" cy="535" rx="280" ry="18" fill="#2E2316" opacity="0.12" filter="blur(6px)"/>

  <!-- BACK HANDLES (under the bag) -->
  <g filter="url(#handle-shadow)">
    <!-- Back Handle Arch -->
    <path d="M 330 220 C 330 65, 470 65, 470 220" fill="none" stroke="url(#leather-grad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 330 220 C 330 65, 470 65, 470 220" fill="none" stroke="#FFA756" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- BAG MAIN BODY -->
  <g filter="url(#drop-shadow)">
    <!-- Main Outer Body -->
    <rect x="170" y="195" width="460" height="330" rx="26" ry="26" fill="url(#jute-pattern)" stroke="url(#piping-grad)" stroke-width="8"/>
    <!-- Lighting overlay on jute -->
    <rect x="170" y="195" width="460" height="330" rx="26" ry="26" fill="url(#jute-shading)"/>
    
    <!-- Outer stitched seam border inside piping -->
    <rect x="176" y="201" width="448" height="318" rx="20" ry="20" fill="none" stroke="#A78D68" stroke-width="1.5" stroke-dasharray="5 3"/>

    <!-- ==================== HORIZONTAL CENTRAL PATTACHITRA BAND ==================== -->
    <!-- Top Orange Ikat Border -->
    <rect x="170" y="278" width="460" height="26" fill="url(#ikat-band-pattern)"/>
    <line x1="170" y1="278" x2="630" y2="278" stroke="#7A3205" stroke-width="1.5"/>
    <line x1="170" y1="304" x2="630" y2="304" stroke="#7A3205" stroke-width="1.5"/>

    <!-- Middle Ivory Pattachitra Art Band -->
    <rect x="170" y="304" width="460" height="74" fill="#FAF6EC"/>
    
    <!-- Pattachitra Procession Motifs (Elephants, Horses, Royal Procession) -->
    <!-- Outer scroll framing -->
    <path d="M 170 306 Q 200 304, 230 306 T 290 306 T 350 306 T 410 306 T 470 306 T 530 306 T 590 306 T 630 306" fill="none" stroke="#8E6941" stroke-width="0.8" opacity="0.6"/>
    <path d="M 170 376 Q 200 378, 230 376 T 290 376 T 350 376 T 410 376 T 470 376 T 530 376 T 590 376 T 630 376" fill="none" stroke="#8E6941" stroke-width="0.8" opacity="0.6"/>

    <!-- Horse 1 & Rider (Left) -->
    <g transform="translate(195, 312)">
      <!-- Horse -->
      <path d="M 15 45 C 10 35, 12 25, 20 22 C 25 20, 30 12, 32 8 C 34 5, 38 6, 37 11 C 36 15, 38 18, 45 22 C 55 25, 60 30, 58 45 L 52 45 L 48 35 L 35 35 L 30 52 L 24 52 L 28 35 L 20 45 Z" fill="#99A8B2" stroke="#222" stroke-width="1"/>
      <!-- Saddle & ornaments -->
      <path d="M 28 26 Q 38 32, 46 26 L 44 34 Q 38 38, 26 32 Z" fill="#D32F2F" stroke="#111" stroke-width="0.8"/>
      <!-- Rider -->
      <circle cx="34" cy="14" r="4" fill="#E0A96D" stroke="#111" stroke-width="0.8"/>
      <path d="M 32 18 L 36 30 L 30 30 Z" fill="#E65100" stroke="#111" stroke-width="0.8"/>
      <!-- Spear / Flag -->
      <line x1="28" y1="2" x2="38" y2="40" stroke="#424242" stroke-width="1"/>
      <polygon points="26,2 34,0 30,8" fill="#D32F2F"/>
    </g>

    <!-- Royal Soldier / Attendant -->
    <g transform="translate(268, 314)">
      <circle cx="10" cy="12" r="3.5" fill="#E0A96D" stroke="#111" stroke-width="0.8"/>
      <path d="M 8 16 L 14 32 L 6 32 Z" fill="#2E7D32" stroke="#111" stroke-width="0.8"/>
      <line x1="8" y1="32" x2="6" y2="48" stroke="#111" stroke-width="1.2"/>
      <line x1="12" y1="32" x2="14" y2="48" stroke="#111" stroke-width="1.2"/>
      <!-- Royal staff/umbrella -->
      <line x1="16" y1="4" x2="12" y2="44" stroke="#8D6E63" stroke-width="1"/>
      <path d="M 8 6 Q 16 0, 24 6 Z" fill="#FBC02D" stroke="#111" stroke-width="0.8"/>
    </g>

    <!-- Grand Royal Elephant with Howdah (Centerpiece) -->
    <g transform="translate(325, 307)">
      <!-- Elephant Body -->
      <path d="M 30 52 L 30 35 C 25 35, 20 28, 20 22 C 20 15, 28 12, 38 12 C 48 12, 60 14, 70 20 C 78 26, 82 35, 80 52 L 72 52 L 72 40 L 62 40 L 60 52 L 50 52 L 52 40 L 40 40 L 38 52 Z" fill="#8898A6" stroke="#1A202C" stroke-width="1.2"/>
      <!-- Trunk and Tusk -->
      <path d="M 22 20 C 14 22, 10 30, 12 40 C 14 45, 18 42, 16 38 C 14 34, 18 28, 22 26" fill="none" stroke="#8898A6" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 22 26 L 12 29" stroke="#FFF9C4" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Big Ear -->
      <path d="M 30 16 C 24 16, 22 26, 28 32 C 34 32, 36 22, 30 16 Z" fill="#6C7A86" stroke="#111" stroke-width="0.8"/>
      <!-- Ornate Cloth / Jhul -->
      <path d="M 35 24 Q 52 30, 68 24 L 66 40 Q 52 45, 36 40 Z" fill="#C62828" stroke="#111" stroke-width="0.8"/>
      <path d="M 40 28 Q 52 34, 62 28 L 60 36 Q 52 40, 40 36 Z" fill="#FFB300"/>
      <!-- Howdah (Royal Seat) -->
      <rect x="42" y="5" width="22" height="10" rx="2" fill="#D84315" stroke="#111" stroke-width="0.8"/>
      <polygon points="40,5 53,-1 66,5" fill="#FBC02D" stroke="#111" stroke-width="0.8"/>
      <!-- King Figure inside Howdah -->
      <circle cx="53" cy="2" r="3" fill="#E0A96D" stroke="#111" stroke-width="0.6"/>
      <polygon points="53,-5 51,-2 55,-2" fill="#FFD600"/>
      <!-- Royal Flag -->
      <line x1="65" y1="5" x2="72" y2="-6" stroke="#333" stroke-width="1"/>
      <polygon points="72,-6 82,-4 74,0" fill="#E53935"/>
    </g>

    <!-- Horse 2 & Rider -->
    <g transform="translate(450, 312)">
      <path d="M 15 45 C 10 35, 12 25, 20 22 C 25 20, 30 12, 32 8 C 34 5, 38 6, 37 11 C 36 15, 38 18, 45 22 C 55 25, 60 30, 58 45 L 52 45 L 48 35 L 35 35 L 30 52 L 24 52 L 28 35 L 20 45 Z" fill="#B0BEC5" stroke="#222" stroke-width="1"/>
      <path d="M 28 26 Q 38 32, 46 26 L 44 34 Q 38 38, 26 32 Z" fill="#1565C0" stroke="#111" stroke-width="0.8"/>
      <circle cx="34" cy="14" r="4" fill="#E0A96D" stroke="#111" stroke-width="0.8"/>
      <path d="M 32 18 L 36 30 L 30 30 Z" fill="#0D47A1" stroke="#111" stroke-width="0.8"/>
      <line x1="28" y1="2" x2="38" y2="40" stroke="#424242" stroke-width="1"/>
      <polygon points="26,2 34,0 30,8" fill="#FBC02D"/>
    </g>

    <!-- Marching Warrior (Right) -->
    <g transform="translate(540, 314)">
      <circle cx="10" cy="12" r="3.5" fill="#E0A96D" stroke="#111" stroke-width="0.8"/>
      <path d="M 8 16 L 14 32 L 6 32 Z" fill="#8E24AA" stroke="#111" stroke-width="0.8"/>
      <line x1="8" y1="32" x2="6" y2="48" stroke="#111" stroke-width="1.2"/>
      <line x1="12" y1="32" x2="14" y2="48" stroke="#111" stroke-width="1.2"/>
      <!-- Shield and Sword -->
      <ellipse cx="6" cy="24" rx="4" ry="6" fill="#F57C00" stroke="#111" stroke-width="0.8"/>
      <line x1="12" y1="18" x2="22" y2="10" stroke="#555" stroke-width="1.2"/>
    </g>

    <!-- Bottom Orange Ikat Border -->
    <rect x="170" y="378" width="460" height="26" fill="url(#ikat-band-pattern)"/>
    <line x1="170" y1="378" x2="630" y2="378" stroke="#7A3205" stroke-width="1.5"/>
    <line x1="170" y1="404" x2="630" y2="404" stroke="#7A3205" stroke-width="1.5"/>
    <!-- ==================== END DECORATIVE BAND ==================== -->

    <!-- Top Zipper & Accent Line -->
    <path d="M 230 206 L 570 206" stroke="#4E3B27" stroke-width="3" stroke-dasharray="6 2"/>
  </g>

  <!-- FRONT HANDLES & LEATHER ANCHOR MOUNTING TABS -->
  <g filter="url(#handle-shadow)">
    <!-- Front Handle Arch -->
    <path d="M 350 230 C 350 90, 450 90, 450 230" fill="none" stroke="url(#leather-grad)" stroke-width="15" stroke-linecap="round"/>
    <path d="M 350 230 C 350 90, 450 90, 450 230" fill="none" stroke="#FFA756" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>
    
    <!-- Left Leather Mounting Tab -->
    <path d="M 338 215 L 362 215 L 366 250 L 350 268 L 334 250 Z" fill="url(#leather-grad)" stroke="#4A1C05" stroke-width="1.5"/>
    <!-- Stitches on Left Tab -->
    <path d="M 341 218 L 359 218 L 362 248 L 350 263 L 338 248 Z" fill="none" stroke="#FFA756" stroke-width="1" stroke-dasharray="2.5 2"/>
    <circle cx="350" cy="235" r="3" fill="#D4AF37" stroke="#333" stroke-width="0.8"/>

    <!-- Right Leather Mounting Tab -->
    <path d="M 438 215 L 462 215 L 466 250 L 450 268 L 434 250 Z" fill="url(#leather-grad)" stroke="#4A1C05" stroke-width="1.5"/>
    <!-- Stitches on Right Tab -->
    <path d="M 441 218 L 459 218 L 462 248 L 450 263 L 438 248 Z" fill="none" stroke="#FFA756" stroke-width="1" stroke-dasharray="2.5 2"/>
    <circle cx="450" cy="235" r="3" fill="#D4AF37" stroke="#333" stroke-width="0.8"/>
  </g>
</svg>

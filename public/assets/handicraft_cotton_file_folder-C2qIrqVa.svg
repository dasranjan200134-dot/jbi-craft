<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Shadow filters -->
    <filter id="folder-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2a241e" flood-opacity="0.22"/>
    </filter>
    <filter id="tab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <!-- Khadi / Cotton Fabric Pattern -->
    <pattern id="cotton-pattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#F7F3EA"/>
      <path d="M0 3h6M3 0v6" stroke="#E3DAC7" stroke-width="0.8"/>
      <path d="M0 0l6 6M6 0l-6 6" stroke="#ECE4D4" stroke-width="0.3" opacity="0.7"/>
    </pattern>

    <!-- Maroon Band Texture -->
    <linearGradient id="maroon-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6F1523"/>
      <stop offset="50%" stop-color="#881B2D"/>
      <stop offset="100%" stop-color="#6F1523"/>
    </linearGradient>

    <!-- Konark Wheel Symbol -->
    <g id="konark-wheel">
      <!-- Outer Wheel Rim with Beads -->
      <circle cx="35" cy="35" r="30" fill="none" stroke="#F6ECD8" stroke-width="2.5"/>
      <circle cx="35" cy="35" r="26.5" fill="none" stroke="#F6ECD8" stroke-width="1"/>
      <circle cx="35" cy="35" r="23" fill="none" stroke="#F6ECD8" stroke-width="1.8"/>
      
      <!-- 16 Spokes (8 Major + 8 Minor) -->
      <!-- Major Spokes with Carvings -->
      <line x1="35" y1="12" x2="35" y2="58" stroke="#F6ECD8" stroke-width="2"/>
      <line x1="12" y1="35" x2="58" y2="35" stroke="#F6ECD8" stroke-width="2"/>
      <line x1="18.7" y1="18.7" x2="51.3" y2="51.3" stroke="#F6ECD8" stroke-width="2"/>
      <line x1="18.7" y1="51.3" x2="51.3" y2="18.7" stroke="#F6ECD8" stroke-width="2"/>
      
      <!-- Minor Spokes -->
      <line x1="35" y1="12" x2="35" y2="58" stroke="#F6ECD8" stroke-width="1.2" transform="rotate(22.5 35 35)"/>
      <line x1="12" y1="35" x2="58" y2="35" stroke="#F6ECD8" stroke-width="1.2" transform="rotate(22.5 35 35)"/>
      <line x1="18.7" y1="18.7" x2="51.3" y2="51.3" stroke="#F6ECD8" stroke-width="1.2" transform="rotate(22.5 35 35)"/>
      <line x1="18.7" y1="51.3" x2="51.3" y2="18.7" stroke="#F6ECD8" stroke-width="1.2" transform="rotate(22.5 35 35)"/>

      <!-- Ornate Spoke Beads / Medallions -->
      <circle cx="35" cy="20" r="2" fill="#F6ECD8"/>
      <circle cx="35" cy="50" r="2" fill="#F6ECD8"/>
      <circle cx="20" cy="35" r="2" fill="#F6ECD8"/>
      <circle cx="50" cy="35" r="2" fill="#F6ECD8"/>
      <circle cx="24.4" cy="24.4" r="2" fill="#F6ECD8"/>
      <circle cx="45.6" cy="45.6" r="2" fill="#F6ECD8"/>
      <circle cx="24.4" cy="45.6" r="2" fill="#F6ECD8"/>
      <circle cx="45.6" cy="24.4" r="2" fill="#F6ECD8"/>

      <!-- Central Hub / Axle -->
      <circle cx="35" cy="35" r="8" fill="#881B2D" stroke="#F6ECD8" stroke-width="2"/>
      <circle cx="35" cy="35" r="4" fill="#F6ECD8"/>
    </g>

    <!-- Traditional Ikat Diamond Divider -->
    <g id="ikat-divider">
      <path d="M 0 10 L 15 2 L 35 10 L 55 2 L 70 10 L 55 18 L 35 10 L 15 18 Z" fill="#F6ECD8" opacity="0.9"/>
      <circle cx="35" cy="10" r="2" fill="#881B2D"/>
    </g>
  </defs>

  <!-- Neutral Background -->
  <rect width="800" height="600" fill="#EFECE6"/>

  <!-- Floor shadow -->
  <ellipse cx="400" cy="535" rx="260" ry="16" fill="#1C1814" opacity="0.14" filter="blur(8px)"/>

  <!-- MAIN FOLDER CONTAINER -->
  <g filter="url(#folder-shadow)">
    <!-- Black Outer Fabric Binding Frame -->
    <rect x="175" y="70" width="450" height="450" rx="10" ry="10" fill="#1C1A17" stroke="#111" stroke-width="2"/>

    <!-- Inner Cotton / Khadi Fabric Face -->
    <rect x="183" y="78" width="434" height="434" rx="4" ry="4" fill="url(#cotton-pattern)"/>

    <!-- Natural fabric shading gradient -->
    <rect x="183" y="78" width="434" height="434" rx="4" ry="4" fill="url(#cotton-pattern)">
      <linearGradient id="fabric-light" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
      </linearGradient>
    </rect>

    <!-- ==================== LEFT MAROON SAMBALPURI BAND ==================== -->
    <g transform="translate(196, 80)">
      <!-- Band Background -->
      <rect x="0" y="0" width="70" height="430" fill="url(#maroon-grad)"/>
      <!-- Gold fine piping lines -->
      <line x1="1" y1="0" x2="1" y2="430" stroke="#DFBD7D" stroke-width="1.5"/>
      <line x1="69" y1="0" x2="69" y2="430" stroke="#DFBD7D" stroke-width="1.5"/>

      <!-- Repeating Konark Wheels & Dividers -->
      <use href="#ikat-divider" x="0" y="10"/>
      <use href="#konark-wheel" x="0" y="30"/>
      <use href="#ikat-divider" x="0" y="105"/>
      <use href="#konark-wheel" x="0" y="130"/>
      <use href="#ikat-divider" x="0" y="205"/>
      <use href="#konark-wheel" x="0" y="230"/>
      <use href="#ikat-divider" x="0" y="305"/>
      <use href="#konark-wheel" x="0" y="330"/>
      <use href="#ikat-divider" x="0" y="405"/>
    </g>

    <!-- ==================== RIGHT MAROON SAMBALPURI BAND ==================== -->
    <g transform="translate(534, 80)">
      <!-- Band Background -->
      <rect x="0" y="0" width="70" height="430" fill="url(#maroon-grad)"/>
      <!-- Gold fine piping lines -->
      <line x1="1" y1="0" x2="1" y2="430" stroke="#DFBD7D" stroke-width="1.5"/>
      <line x1="69" y1="0" x2="69" y2="430" stroke="#DFBD7D" stroke-width="1.5"/>

      <!-- Repeating Konark Wheels & Dividers -->
      <use href="#ikat-divider" x="0" y="10"/>
      <use href="#konark-wheel" x="0" y="30"/>
      <use href="#ikat-divider" x="0" y="105"/>
      <use href="#konark-wheel" x="0" y="130"/>
      <use href="#ikat-divider" x="0" y="205"/>
      <use href="#konark-wheel" x="0" y="230"/>
      <use href="#ikat-divider" x="0" y="305"/>
      <use href="#konark-wheel" x="0" y="330"/>
      <use href="#ikat-divider" x="0" y="405"/>
    </g>

    <!-- Subtle Stitching Lines around perimeter -->
    <rect x="187" y="82" width="426" height="426" rx="2" ry="2" fill="none" stroke="#D1C3A5" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- ==================== TOP CLOSURE TAB ==================== -->
    <g transform="translate(376, 62)" filter="url(#tab-shadow)">
      <!-- Tab Base -->
      <rect x="0" y="0" width="48" height="85" rx="5" ry="5" fill="url(#cotton-pattern)" stroke="#D8CAAF" stroke-width="1"/>
      <rect x="0" y="0" width="48" height="85" rx="5" ry="5" fill="#1C1A17" fill-opacity="0.05"/>
      <!-- Tab Stitching -->
      <rect x="3" y="3" width="42" height="79" rx="3" ry="3" fill="none" stroke="#9E8D6B" stroke-width="1" stroke-dasharray="3 2"/>
      <!-- Tab Bottom Edge Grip Line -->
      <line x1="12" y1="74" x2="36" y2="74" stroke="#9E8D6B" stroke-width="1.5"/>
    </g>
  </g>
</svg>
